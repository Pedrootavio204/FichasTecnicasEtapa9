
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Fichas Técnicas</title>

    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <h1>Sistema de Fichas Técnicas</h1>
        <p>Gerenciamento de produtos e fichas técnicas</p>
    </header>

    <main class="container">

        <section class="painel">

            <div class="painel-topo">
                <h2>Listagem de Produtos</h2>

                <a href="cadastro.html" class="botao botao-novo">
                    + Nova Ficha
                </a>
            </div>

            <div class="area-pesquisa">
                <label for="campoBusca">Buscar produto:</label>

                <input
                    type="search"
                    id="campoBusca"
                    placeholder="Digite o nome ou categoria..."
                >
            </div>

            <div class="tabela-responsiva">
                <table id="tabelaProdutos">

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Tipo de tecido</th>
                            <th>Data do produto</th>
                            <th>Observações</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>
            </div>

            <p id="mensagemSemResultados" hidden>
                Nenhum produto encontrado.
            </p>

        </section>

    </main>

    <footer class="rodape">
        <p>Projeto Integrador - Senac | Sistema de Fichas Técnicas</p>
    </footer>

</body>
</html>
