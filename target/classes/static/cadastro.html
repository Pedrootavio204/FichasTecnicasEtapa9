
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto - Fichas Técnicas</title>

    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <h1>Sistema de Fichas Técnicas</h1>
        <p>Gerenciamento de produtos e fichas técnicas</p>
    </header>

    <main class="container">

        <section class="painel">

            <div class="painel-topo">
                <h2>Cadastro de Produto</h2>
            </div>

            <form id="formCadastro" novalidate>

                <div class="campos-cadastro">

                    <!-- COLUNA ESQUERDA -->
                    <div class="coluna-cadastro">

                        <div class="grupo-campo">
                            <label for="nomeProduto">
                                Nome do produto *
                            </label>
                            <input
                                type="text"
                                id="nomeProduto"
                                name="nome"
                                maxlength="45"
                                placeholder="Ex.: Camiseta Básica"
                                required
                            >
                        </div>

                        <div class="grupo-campo">
                            <label for="categoriaProduto">
                                Categoria *
                            </label>
                            <input
                                type="text"
                                id="categoriaProduto"
                                name="categoria"
                                maxlength="45"
                                placeholder="Ex.: Camisetas"
                                required
                            >
                        </div>

                        <div class="grupo-campo">
                            <label for="tipoTecido">
                                Tipo de tecido *
                            </label>
                            <input
                                type="text"
                                id="tipoTecido"
                                name="tipoTecido"
                                maxlength="45"
                                placeholder="Ex.: Algodão"
                                required
                            >
                        </div>

                    </div>

                    <!-- COLUNA DIREITA -->
                    <div class="coluna-cadastro">

                        <div class="grupo-campo">
                            <label for="observacoes">
                                Observações
                            </label>
                            <textarea
                                id="observacoes"
                                name="observacoes"
                                maxlength="45"
                                rows="3"
                                placeholder="Observações sobre o produto..."
                            ></textarea>
                        </div>

                        <div class="grupo-campo">
                            <label for="dataProduto">
                                Data do produto
                            </label>
                            <input
                                type="date"
                                id="dataProduto"
                                name="data"
                            >
                        </div>

                    </div>

                </div>

                <p class="aviso-obrigatorio">
                    * Campos obrigatórios
                </p>

                <p
                    id="mensagemCadastro"
                    role="status"
                    aria-live="polite"
                ></p>

                <div class="acoes-formulario">

                    <button
                        type="submit"
                        class="botao botao-novo"
                    >
                        Salvar
                    </button>

                    <a
                        href="index.html"
                        class="botao botao-cancelar"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

    <footer class="rodape">
        <p>Projeto Integrador - Senac | Sistema de Fichas Técnicas</p>
    </footer>

</body>
</html>
