
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro da Ficha Técnica</title>

    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <h1>Sistema de Fichas Técnicas</h1>
        <p>Gerenciamento de produtos e fichas técnicas</p>
    </header>

    <main class="container">

        <section class="painel">

            <div class="painel-topo">
                <h2>Cadastro da Ficha Técnica</h2>
            </div>

            <form id="formFichaTecnica" novalidate>

                <div class="grupo-campo">
                    <label for="composicaoTecido">
                        Composição do Tecido *
                    </label>

                    <input
                        type="text"
                        id="composicaoTecido"
                        name="composicaoTecido"
                        placeholder="Ex.: 100% Algodão"
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="tipoCostura">
                        Tipo de Costura *
                    </label>

                    <input
                        type="text"
                        id="tipoCostura"
                        name="tipoCostura"
                        placeholder="Ex.: Costura reta"
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="processoFabricacao">
                        Processo de Fabricação *
                    </label>

                    <textarea
                        id="processoFabricacao"
                        name="processoFabricacao"
                        rows="4"
                        placeholder="Descreva o processo de fabricação..."
                        required
                    ></textarea>
                </div>

                <p class="aviso-obrigatorio">
                    * Campos obrigatórios
                </p>

                <p
                    id="mensagemFicha"
                    role="status"
                    aria-live="polite"
                ></p>

                <div class="acoes-formulario">

                    <a
                        href="index.html"
                        id="botaoCancelarFicha"
                        class="botao botao-cancelar"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="botao botao-novo"
                    >
                        Salvar
                    </button>

                </div>

            </form>

        </section>

    </main>

    <footer class="rodape">
        <p>Projeto Integrador - Senac | Sistema de Fichas Técnicas</p>
    </footer>

</body>
</html>
